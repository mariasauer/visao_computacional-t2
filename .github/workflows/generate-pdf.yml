name: Generate PDF Documentation

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths:
      - 'relatorio.md'
      - '.github/workflows/generate-pdf.yml'
  workflow_dispatch:

jobs:
  convert-to-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        run: |
          docker run --rm \
            -v "$PWD":/data \
            -w /data \
            --user "$(id -u)":"$(id -g)" \
            --entrypoint sh \
            ghcr.io/pandoc/latex:latest \
            -c "pandoc relatorio.md -o relatorio.pdf --pdf-engine=xelatex --number-sections --highlight-style=tango"

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-pdf
          path: relatorio.pdf
          retention-days: 90

      - name: Commit PDF to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add relatorio.pdf
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: update relatorio.pdf [skip ci]"

      - name: Push changes
        run: git push
